<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jobreport-web</title>
  <script src="/static/htmx.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    body {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: #0d1117; color: #c9d1d9; margin: 0; padding: 2rem;
    }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 1.5rem; color: #e6edf3; }
    form { max-width: 720px; }
    fieldset {
      border: 1px solid #30363d; border-radius: 8px; margin: 0 0 1.25rem; padding: 1rem;
      background: #161b22;
    }
    legend { padding: 0 0.5rem; color: #8b949e; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
    label { display: block; margin: 0 0 0.35rem; color: #8b949e; font-size: 0.85rem; }
    input, select, button {
      font: inherit; background: #0d1117; color: #c9d1d9;
      border: 1px solid #30363d; border-radius: 6px; padding: 0.4rem 0.6rem;
    }
    input:focus, select:focus { outline: none; border-color: #1f6feb; }
    button {
      background: #238636; color: #fff; border-color: #2ea043; cursor: pointer;
    }
    button:hover { background: #2ea043; }
    button.danger { background: #b62324; border-color: #da3633; }
    button.danger:hover { background: #da3633; }
    .row { display: flex; gap: 0.5rem; align-items: flex-end; flex-wrap: wrap; }
    .row > div { flex: 1 1 auto; }
    .time-group { display: flex; gap: 0.5rem; }
    .time-group > div { flex: 1; }
    #results { margin-top: 1.5rem; }
    pre {
      background: #161b22; border: 1px solid #30363d; border-radius: 8px;
      padding: 1rem; overflow: auto; white-space: pre-wrap; word-break: break-word;
    }
    .error { color: #f85149; }
    .muted { color: #8b949e; font-size: 0.85rem; margin: 0.25rem 0; }

    /* Selectable Prometheus URL list */
    #prom-list { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 0.75rem; }
    .prom-option {
      display: flex; align-items: center; gap: 0.5rem; cursor: pointer;
      padding: 0.45rem 0.6rem; border: 1px solid #30363d; border-radius: 6px;
      color: #c9d1d9; margin: 0;
    }
    .prom-option:hover { border-color: #1f6feb; }
    .prom-option input { width: auto; margin: 0; }
    .prom-option .check { visibility: hidden; color: #3fb950; font-weight: bold; }
    .prom-option .url { word-break: break-all; flex: 1 1 auto; }
    /* highlight the selected (checked) URL with a background + checkmark */
    .prom-option:has(input:checked) { background: #14361f; border-color: #2ea043; }
    .prom-option:has(input:checked) .check { visibility: visible; }

    /* htmx loading indicator: a banner that appears during a report request */
    #report-status {
      margin: 0.75rem 0; padding: 0.5rem 0.75rem; border-radius: 6px;
      background: #1c2c44; border: 1px solid #1f6feb; color: #c9d1d9;
      opacity: 0; height: 0; padding-top: 0; padding-bottom: 0; overflow: hidden;
      transition: opacity 150ms ease-in;
    }
    #report-status.htmx-request {
      opacity: 1; height: auto; padding-top: 0.5rem; padding-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <h1>jobreport-web</h1>

  <form>
  <fieldset>
    <legend>Prometheus URL</legend>
    <label>Select the URL to query (or add a new one)</label>
    <div id="prom-list">
      {{template "urls" .URLs}}
    </div>
    <div class="row">
      <div style="flex: 1 1 auto;">
        <input id="new-url" type="text" name="url" placeholder="https://prometheus.example/" style="width: 100%;">
      </div>
      <div style="flex: 0 0 auto;">
        <button type="button"
                hx-post="/prometheus"
                hx-include="#new-url"
                hx-target="#prom-list"
                hx-swap="innerHTML">Add</button>
      </div>
      <div style="flex: 0 0 auto;">
        <button type="button" class="danger"
                hx-post="/prometheus/delete"
                hx-include="[name='prom']:checked"
                hx-target="#prom-list"
                hx-swap="innerHTML"
                hx-confirm="Remove the selected Prometheus URL from the list?">Delete selected</button>
      </div>
    </div>
  </fieldset>

    <fieldset>
      <legend>Report</legend>
      <div class="row">
        <div>
          <label for="job_id">Job ID (optional &mdash; numeric, from the .../-/jobs/&lt;id&gt; URL)</label>
          <input id="job_id" type="text" name="job_id" inputmode="numeric" pattern="[0-9]*" placeholder="e.g. 127743797" style="width: 100%;">
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Time window (UTC) &mdash; optional, defaults to last 10m</legend>
      <div class="row">
        <div>
          <label>Start</label>
          <div class="time-group">
            <div><label for="start_date">Date</label><input id="start_date" type="date" name="start_date"></div>
            <div><label for="start_hour">Hour</label><input id="start_hour" type="number" name="start_hour" min="0" max="23" placeholder="HH"></div>
            <div><label for="start_min">Minute</label><input id="start_min" type="number" name="start_min" min="0" max="59" placeholder="MM"></div>
          </div>
        </div>
      </div>
      <div class="row" style="margin-top: 0.75rem;">
        <div>
          <label>End</label>
          <div class="time-group">
            <div><label for="end_date">Date</label><input id="end_date" type="date" name="end_date"></div>
            <div><label for="end_hour">Hour</label><input id="end_hour" type="number" name="end_hour" min="0" max="23" placeholder="HH"></div>
            <div><label for="end_min">Minute</label><input id="end_min" type="number" name="end_min" min="0" max="59" placeholder="MM"></div>
          </div>
        </div>
      </div>
    </fieldset>

    <button type="button"
            hx-post="/report"
            hx-include="closest form"
            hx-target="#results"
            hx-swap="innerHTML"
            hx-indicator="#report-status">Report</button>

    <div id="report-status" aria-live="polite">⏳ Running report — contacting the selected Prometheus URL…</div>
  </form>

  <div id="results"></div>
</body>
</html>
