version: 2

builds:
  - id: gitlab-procs-exporter
    main: ./main.go
    binary: gitlab-procs-exporter
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.revision={{.Tag}}-{{.ShortCommit}}

  # jobreport: one-shot CLI that renders top-N process reports from Prometheus
  # (and parses GitLab job logs). Ships alongside the exporter so CI jobs can
  # call it directly. Stdlib-only, so it cross-compiles cleanly.
  - id: jobreport
    main: ./cmd/jobreport
    binary: jobreport
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: gitlab-procs-exporter
    ids:
      - gitlab-procs-exporter
      - jobreport
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - id: gitlab-procs-exporter
    package_name: gitlab-procs-exporter
    ids:
      - gitlab-procs-exporter
      - jobreport
    vendor: rachlenko
    homepage: https://github.com/rachlenko/gitlab-procs-exporter
    maintainer: Evgeny Rachlenko <evgeny.rachlenko@gmail.com>
    description: Prometheus process exporter with active 10m sliding history window and dynamic dashboard
    license: MIT
    formats:
      - deb
      - rpm

dockers:
  - id: amd64
    goos: linux
    goarch: amd64
    ids:
      - gitlab-procs-exporter
    dockerfile: Dockerfile.goreleaser
    use: buildx
    image_templates:
      - "ghcr.io/rachlenko/gitlab-procs-exporter:{{ .Tag }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.source=https://github.com/rachlenko/gitlab-procs-exporter"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=MIT"
  - id: arm64
    goos: linux
    goarch: arm64
    ids:
      - gitlab-procs-exporter
    dockerfile: Dockerfile.goreleaser
    use: buildx
    image_templates:
      - "ghcr.io/rachlenko/gitlab-procs-exporter:{{ .Tag }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.source=https://github.com/rachlenko/gitlab-procs-exporter"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=MIT"

docker_manifests:
  - name_template: "ghcr.io/rachlenko/gitlab-procs-exporter:{{ .Tag }}"
    image_templates:
      - "ghcr.io/rachlenko/gitlab-procs-exporter:{{ .Tag }}-amd64"
      - "ghcr.io/rachlenko/gitlab-procs-exporter:{{ .Tag }}-arm64"
  - name_template: "ghcr.io/rachlenko/gitlab-procs-exporter:latest"
    image_templates:
      - "ghcr.io/rachlenko/gitlab-procs-exporter:{{ .Tag }}-amd64"
      - "ghcr.io/rachlenko/gitlab-procs-exporter:{{ .Tag }}-arm64"
