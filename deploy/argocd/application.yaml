# ArgoCD Application that deploys the gitlab-procs-exporter DaemonSet from this
# repo's deploy/k8s/ kustomization. Apply into the argocd namespace:
#   kubectl apply -f deploy/argocd/application.yaml -n argocd
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitlab-procs-exporter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rachlenko/gitlab-procs-exporter.git
    path: deploy/k8s
    # Track main so deploy-manifest changes (Service, ServiceMonitor, image tag)
    # roll out via GitOps. The container image itself is pinned in kustomization.yaml.
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
