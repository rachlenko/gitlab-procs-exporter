# Config for the exporter's --config flag: extra environ redaction filters and
# per-label size limits. Read once at startup, FAIL-FAST — an unreadable file, an
# unknown TOP-LEVEL key (a misspelled `redact_key_substrings` would otherwise
# silently disable every redaction filter), an unknown label under
# max_label_bytes, or a limit outside 49-8143 bytes makes the pod exit
# (CrashLoopBackOff); the error in `kubectl logs` names the offending key.
# See the project README sections "Adding sensitive-data filters" and
# "Label size contract". Edit and `kubectl rollout restart` the DaemonSet to apply.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlab-procs-exporter-config
  namespace: monitoring
data:
  config.yaml: |
    # Case-insensitive substrings matched against the variable NAME; any match
    # renders that variable as NAME=[REDACTED] in the gitlab_process_info label.
    redact_key_substrings:
      - vault
      - internal_token

    # Raise or lower individual entries of the published label size contract.
    # Overridable names: name, cmdline, ci_job_name, ci_project_path,
    # ci_job_id, ci_pipeline_id. Each override must be 49-8143 bytes: below the
    # floor a cut value is mostly truncation marker, and above the ceiling a cut
    # value can exceed the servicemonitor's 8192-byte labelValueLengthLimit,
    # which costs the WHOLE scrape. Omitted labels keep their default. Watch
    # gitlab_exporter_label_truncations_total to see which limits are being hit.
    # max_label_bytes:
    #   ci_job_name: 512
    #   ci_project_path: 512
