# Tells the Prometheus Operator to scrape the exporter Service's endpoints.
# Requires the Prometheus Operator CRDs (see deploy/argocd/kube-prometheus-stack.yaml).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gitlab-procs-exporter
  namespace: monitoring
  labels:
    app: gitlab-procs-exporter
    # Matched by kube-prometheus-stack's default serviceMonitorSelector. Harmless
    # when serviceMonitorSelectorNilUsesHelmValues=false (matches all).
    release: kube-prometheus-stack
spec:
  # Defence in depth against the exporter's own label size contract missing an
  # entry. Must stay AT OR ABOVE the exporter's 8192-byte environ ceiling: set
  # it lower and Prometheus rejects the WHOLE scrape, not just the long label.
  # See the README section "Defence in depth in the scrape config".
  labelValueLengthLimit: 8192
  labelLimit: 32
  selector:
    matchLabels:
      app: gitlab-procs-exporter
  namespaceSelector:
    matchNames:
      - monitoring
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
