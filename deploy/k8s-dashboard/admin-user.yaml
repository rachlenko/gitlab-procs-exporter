# Admin ServiceAccount used to log in to Headlamp. Mint a short-lived token with:
#   kubectl create token headlamp-admin -n headlamp
# cluster-admin is broad — fine for a single-user lab; scope it down for shared
# clusters.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-admin
  namespace: headlamp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp-admin
    namespace: headlamp
